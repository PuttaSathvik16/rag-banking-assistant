# Retrieval-pipeline configuration. Nothing here should be hardcoded in src/.
chunking:
  strategy: "token_window"      # token-aware chunking with tiktoken
  chunk_size_tokens: 256        # target tokens per chunk
  overlap_tokens: 32            # token overlap between chunks
  min_chunk_tokens: 20          # minimum tokens per chunk

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  dimensionality: 384

vector_store:
  backend: "chroma"
  persist_dir: "data/chroma_db"
  collection_name: "banking_corpus"

retrieval:
  bm25_top_k: 15
  vector_top_k: 15
  rrf_k: 60                     # RRF smoothing constant
  fused_top_n: 10                # candidates passed to reranker
  final_top_k: 4                 # chunks passed to the generator after reranking

reranker:
  model_name: "BAAI/bge-reranker-base"

generation:
  model: "gemini-3.6-flash"
  temperature: 0.1
  max_output_tokens: 1024
  abstention_confidence_threshold: 0.35   # below this, the system abstains

query_transform:
  enabled: true
  model: "gemini-3.6-flash"

evaluation:
  golden_set_path: "eval/golden_set.json"
  ragas_metrics: ["context_precision", "context_recall", "faithfulness", "answer_relevancy"]
  judge_model: "gemini-3.6-flash"

engineering:
  max_retries: 3
  retry_backoff_seconds: 2
